<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Namoz kalendari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Variant 4 — "Namaz Tracker": qorong'i, binafsha gradient, kunlar lentasi + oylik jadval */
  :root{
    --bg:#0d0b1e;
    --surface:#16132c;
    --surface-2:#1f1b3b;
    --border:#2b2652;
    --text:#efecff;
    --muted:#9791bd;
    --g1:#7b5cff;
    --g2:#c86bfa;
    --accent:#a78bfa;
    --ok:#34d399;   --ok-bg:rgba(52,211,153,.14);
    --jam:#a78bfa;  --jam-bg:rgba(167,139,250,.18);
    --late:#fbbf24; --late-bg:rgba(251,191,36,.14);
    --miss:#f87171; --miss-bg:rgba(248,113,113,.14);
    --glow:0 10px 40px rgba(123,92,255,.25);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f3ff; --surface:#ffffff; --surface-2:#f0edfc; --border:#e3def7;
      --text:#1d1838; --muted:#6f6a8f; --accent:#6d4cf5;
      --ok:#119163;   --ok-bg:#dcf5ea;
      --jam:#6d4cf5;  --jam-bg:#ebe5ff;
      --late:#b7790a; --late-bg:#fcf0d5;
      --miss:#d33c3c; --miss-bg:#fde2e2;
      --glow:0 10px 30px rgba(109,76,245,.15);
    }
  }
  :root[data-theme="light"]{
    --bg:#f5f3ff; --surface:#ffffff; --surface-2:#f0edfc; --border:#e3def7;
    --text:#1d1838; --muted:#6f6a8f; --accent:#6d4cf5;
    --ok:#119163;   --ok-bg:#dcf5ea;
    --jam:#6d4cf5;  --jam-bg:#ebe5ff;
    --late:#b7790a; --late-bg:#fcf0d5;
    --miss:#d33c3c; --miss-bg:#fde2e2;
    --glow:0 10px 30px rgba(109,76,245,.15);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:Sora,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45;
    background-image:radial-gradient(600px 400px at 90% -10%,rgba(123,92,255,.22),transparent 70%),
                     radial-gradient(500px 300px at -10% 10%,rgba(200,107,250,.12),transparent 70%);
    background-attachment:fixed;min-height:100vh;
  }
  button{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 48px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--glow);
  }
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .brand small{display:block;font-size:12px;color:var(--muted)}
  .tools{display:flex;gap:8px;align-items:center}
  .btn{
    height:40px;min-width:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);
  }
  .btn:hover{border-color:var(--accent)}
  .btn.armed{background:var(--miss-bg);color:var(--miss);border-color:var(--miss)}

  .monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px}
  .monthnav button{width:34px;height:32px;border:none;background:transparent;border-radius:10px;cursor:pointer;font-size:16px}
  .monthnav button:hover{background:var(--surface-2)}
  .monthnav .label{min-width:124px;text-align:center;font-weight:700;font-size:14px}

  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px}

  /* ---------- hero ---------- */
  .hero{
    border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--glow);margin-bottom:18px;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;
    border:28px solid rgba(255,255,255,.1);
  }
  .hero-row{display:flex;justify-content:space-between;gap:12px;position:relative;z-index:1}
  .hero small{font-size:12px;opacity:.8;display:block}
  .hero .big{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.03em}
  .hero .big span{font-size:16px;font-weight:600;opacity:.85;margin-left:4px}
  .hero .right{text-align:right}
  .hero .progress{height:8px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:16px;overflow:hidden;position:relative;z-index:1}
  .hero .progress i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s ease}

  /* ---------- kunlar lentasi ---------- */
  .strip{
    display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px 8px;
    scrollbar-width:thin;
  }
  .sday{
    flex:none;width:58px;scroll-snap-align:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:8px 0 10px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .sday:hover{border-color:var(--accent)}
  .sday .w{font-size:11px;color:var(--muted);font-weight:600}
  .sday .mini{
    --p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--surface-2) 0);
  }
  .sday .mini b{
    width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
    font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .sday.today .w{color:var(--accent)}
  .sday.sel{background:linear-gradient(160deg,var(--g1),var(--g2));border-color:transparent;color:#fff}
  .sday.sel .w{color:rgba(255,255,255,.85)}
  .sday.sel .mini{background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}
  .sday.sel .mini b{background:var(--g1);color:#fff}
  .sday.future{opacity:.5}

  /* ---------- tanlangan kun ---------- */
  .focus-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .focus-head h2{margin:0;font-size:17px;font-weight:700}
  .focus-head span{font-size:12px;color:var(--muted)}
  .prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  .prow:first-of-type{border-top:none}
  .prow .ico{
    width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:var(--surface-2);color:var(--accent);
  }
  .prow .txt{flex:1;min-width:0}
  .prow .txt b{display:block;font-size:15px;font-weight:700}
  .prow .txt small{font-size:12px;color:var(--muted)}
  .prow .cell{
    appearance:none;cursor:pointer;border-radius:12px;height:40px;min-width:124px;padding:0 12px;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;
    background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
    transition:transform .08s ease;
  }
  .prow .cell:active{transform:scale(.96)}
  .prow .cell .mark{font-size:16px;font-weight:800}

  .cell[data-state="+"]{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
  .cell[data-state="J"]{background:var(--jam-bg);border-color:transparent;color:var(--jam)}
  .cell[data-state="q"]{background:var(--late-bg);border-color:transparent;color:var(--late)}
  .cell[data-state="-"]{background:var(--miss-bg);border-color:transparent;color:var(--miss)}

  /* ---------- statistika ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--surface-2);border-radius:16px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat small{font-size:11px;color:var(--muted)}
  .stat.j b{color:var(--jam)} .stat.ok b{color:var(--ok)}
  .stat.q b{color:var(--late)} .stat.m b{color:var(--miss)}

  .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin-bottom:12px}
  .bar i{display:block;height:100%}
  .bar .s-J{background:var(--jam)} .bar .s-plus{background:var(--ok)}
  .bar .s-q{background:var(--late)} .bar .s-minus{background:var(--miss)}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:16px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .chip{width:18px;height:18px;border-radius:6px;display:inline-grid;place-items:center;font-weight:800;font-size:11px;font-style:normal}
  .chip.J{background:var(--jam-bg);color:var(--jam)}
  .chip.plus{background:var(--ok-bg);color:var(--ok)}
  .chip.q{background:var(--late-bg);color:var(--late)}
  .chip.minus{background:var(--miss-bg);color:var(--miss)}
  .chip.none{background:var(--surface-2);color:var(--muted)}

  /* ---------- oylik jadval ---------- */
  .table-head,.trow{display:grid;grid-template-columns:64px repeat(5,1fr);gap:5px;align-items:center}
  .table-head{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;text-align:center}
  .table-head span:first-child{text-align:left}
  .tbody{display:flex;flex-direction:column;gap:5px;max-height:560px;overflow-y:auto;padding-right:2px}
  .trow .dl{
    border:none;background:none;cursor:pointer;text-align:left;padding:0;
    font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .trow .dl b{color:var(--text);font-size:13px;margin-right:4px}
  .trow.today .dl b{color:var(--accent)}
  .trow.sel .dl b{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:6px;padding:0 5px}
  .trow.future{opacity:.5}
  .trow .cell{
    appearance:none;cursor:pointer;height:30px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--muted);font-weight:800;font-size:13px;padding:0;
  }
  .trow .cell:hover{border-color:var(--accent)}
  .trow .cell[data-state=""]{opacity:.7}

  .hint{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    .tbody{max-height:none}
  }
  @media (max-width:560px){
    .top{gap:10px}
    .monthnav{flex:1}
    .monthnav .label{flex:1;min-width:0}
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero .big{font-size:34px}
    .prow .cell{min-width:0;width:52px;padding:0}
    .prow .cell .lbl{display:none}
    .panel{padding:14px}
    .table-head,.trow{grid-template-columns:52px repeat(5,1fr)}
    .trow .cell{height:34px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="#fff"/></svg>
      </div>
      <div><h1>Namoz kalendari</h1><small>besh vaqt namoz kundaligi</small></div>
    </div>
    <div class="tools">
      <div class="monthnav">
        <button id="prevBtn" aria-label="Oldingi oy">‹</button>
        <div class="label" id="monthLabel">—</div>
        <button id="nextBtn" aria-label="Keyingi oy">›</button>
      </div>
      <button class="btn" id="todayBtn">Bugun</button>
      <button class="btn" id="clearBtn">Oyni tozalash</button>
      <button class="btn" id="themeBtn" title="Mavzu">◐</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <section class="hero">
        <div class="hero-row">
          <div>
            <small>Ketma-ket to'liq kunlar</small>
            <div class="big" id="streak">0<span>kun</span></div>
          </div>
          <div class="right">
            <small>Bugun</small>
            <div class="big" id="todayNum">0<span>/5</span></div>
          </div>
        </div>
        <div class="progress"><i id="todayBar" style="width:0%"></i></div>
      </section>

      <div class="strip" id="strip"></div>

      <section class="panel">
        <div class="focus-head"><h2 id="fTitle">—</h2><span id="fSub">—</span></div>
        <div id="focus"></div>
        <p class="hint">Tugmani bosing — belgi almashadi: · → + → J → q → − → ·</p>
      </section>
    </div>

    <section class="panel">
      <div class="stats">
        <div class="stat j"><b id="cJ">0</b><small>Jamoat (J)</small></div>
        <div class="stat ok"><b id="cP">0</b><small>O'qildi (+)</small></div>
        <div class="stat q"><b id="cQ">0</b><small>Qazo (q)</small></div>
        <div class="stat m"><b id="cM">0</b><small>O'qilmadi (−)</small></div>
      </div>
      <div class="bar" id="bar"></div>
      <div class="legend">
        <span><i class="chip J">J</i> jamoat</span>
        <span><i class="chip plus">+</i> o'qildi</span>
        <span><i class="chip q">q</i> kech / qazo</span>
        <span><i class="chip minus">−</i> o'qilmadi</span>
        <span><i class="chip none">·</i> belgilanmagan</span>
      </div>

      <div class="table-head"><span>Kun</span><span>Bom.</span><span>Pesh.</span><span>Asr</span><span>Shom</span><span>Xuft.</span></div>
      <div class="tbody" id="table"></div>
    </section>
  </div>
</div>

<script>
/* Faqat UI — ma'lumot localStorage'da (index.html bilan bir xil kalit). */

const ICONS = {
  bomdod:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.6 10.6l1.4 1.4M18.4 10.6 17 12"/></svg>',
  peshin:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  asr:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3"/><path d="M9 2v1.5M3.5 9H2M4.8 4.8l1 1M13.2 4.8l-1 1M8 20h9a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 8 20Z"/></svg>',
  shom:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 3v6M9 6l3 3 3-3"/></svg>',
  xufton:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>',
};
const PRAYERS = [
  { key:'bomdod', name:'Bomdod', time:'Tong' },
  { key:'peshin', name:'Peshin', time:'Tush' },
  { key:'asr',    name:'Asr',    time:'Ikkindi' },
  { key:'shom',   name:'Shom',   time:'Kun botishi' },
  { key:'xufton', name:'Xufton', time:'Kecha' },
];
const CYCLE  = ['', '+', 'J', 'q', '-'];
const LABEL  = { '':'Belgilash', '+':"O'qildi", 'J':'Jamoat', 'q':'Qazo', '-':"O'qilmadi" };
const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const DOW    = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const DOW_S  = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];

const store = {
  KEY: 'namoz:v1',
  data: {},
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch(e){ this.data = {}; }
  },
  save(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  },
  get(day, prayer){ return (this.data[day] || {})[prayer] || ''; },
  set(day, prayer, val){
    if(!this.data[day]) this.data[day] = {};
    if(val) this.data[day][prayer] = val; else delete this.data[day][prayer];
    if(!Object.keys(this.data[day]).length) delete this.data[day];
    this.save();
  },
  clearMonth(y, m){
    const pre = y + '-' + String(m+1).padStart(2,'0') + '-';
    Object.keys(this.data).forEach(k => { if(k.startsWith(pre)) delete this.data[k]; });
    this.save();
  }
};

const today = new Date();
const todayKey = iso(today);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = todayKey;

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromIso(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function pretty(d){
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
const markOf  = st => st === '-' ? '−' : (st || '·');
const done    = st => st === '+' || st === 'J' || st === 'q';
const dayDone = key => PRAYERS.filter(p => done(store.get(key, p.key))).length;

/* ---- render ---- */
const $strip = document.getElementById('strip');
const $table = document.getElementById('table');

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  const total = new Date(y, m+1, 0).getDate();
  document.getElementById('monthLabel').textContent = MONTHS[m] + ' ' + y;

  let s = '', t = '';
  for(let d = 1; d <= total; d++){
    const date = new Date(y, m, d);
    s += stripHtml(date);
    t += rowHtml(date);
  }
  $strip.innerHTML = s;
  $table.innerHTML = t;

  renderFocus();
  renderStats();
  renderHero();
  scrollStrip();
}

function flags(date, key){
  return [key === todayKey ? 'today' : '', key === selected ? 'sel' : '', date > today ? 'future' : ''];
}

function stripHtml(date){
  const key = iso(date);
  const cls = ['sday'].concat(flags(date, key)).join(' ').replace(/\s+/g,' ').trim();
  return '<button class="'+cls+'" data-key="'+key+'">'
       +   '<span class="w">'+DOW_S[date.getDay()]+'</span>'
       +   '<span class="mini" style="--p:'+(dayDone(key)/5*100)+'"><b>'+date.getDate()+'</b></span>'
       + '</button>';
}

function rowHtml(date){
  const key = iso(date);
  const cls = ['trow'].concat(flags(date, key)).join(' ').replace(/\s+/g,' ').trim();
  return '<div class="'+cls+'" data-key="'+key+'">'
       +   '<button class="dl" data-key="'+key+'"><b>'+String(date.getDate()).padStart(2,'0')+'</b>'+DOW_S[date.getDay()]+'</button>'
       +   PRAYERS.map(p => {
             const st = store.get(key, p.key);
             return '<button class="cell" data-day="'+key+'" data-prayer="'+p.key+'" data-state="'+st+'" title="'+p.name+'">'
                  +   '<span class="mark">'+markOf(st)+'</span></button>';
           }).join('')
       + '</div>';
}

function renderFocus(){
  const date = fromIso(selected);
  document.getElementById('fTitle').textContent = DOW[date.getDay()] + ', ' + pretty(date);
  document.getElementById('fSub').textContent = dayDone(selected) + '/5 bajarildi';
  document.getElementById('focus').innerHTML = PRAYERS.map(p => {
    const st = store.get(selected, p.key);
    return '<div class="prow">'
         +   '<span class="ico">'+ICONS[p.key]+'</span>'
         +   '<span class="txt"><b>'+p.name+'</b><small>'+p.time+'</small></span>'
         +   '<button class="cell" data-day="'+selected+'" data-prayer="'+p.key+'" data-state="'+st+'">'
         +     '<span class="mark">'+markOf(st)+'</span><span class="lbl">'+LABEL[st]+'</span>'
         +   '</button>'
         + '</div>';
  }).join('');
}

function renderHero(){
  const n = dayDone(todayKey);
  document.getElementById('todayNum').innerHTML = n + '<span>/5</span>';
  document.getElementById('todayBar').style.width = (n/5*100) + '%';

  // bugundan orqaga: 5 tasi ham o'qilgan kunlar. Bugun hali tugamagan bo'lsa kechadan sanaladi.
  let streak = 0;
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if(n < 5) d.setDate(d.getDate() - 1);
  while(dayDone(iso(d)) === 5){ streak++; d.setDate(d.getDate() - 1); }
  document.getElementById('streak').innerHTML = streak + '<span>kun</span>';
}

function renderStats(){
  const y = view.getFullYear(), m = view.getMonth();
  const total = new Date(y, m+1, 0).getDate();
  const c = { 'J':0, '+':0, 'q':0, '-':0 };
  for(let d = 1; d <= total; d++){
    const rec = store.data[iso(new Date(y, m, d))] || {};
    for(const p of PRAYERS){ const s = rec[p.key]; if(s in c) c[s]++; }
  }
  document.getElementById('cJ').textContent = c['J'];
  document.getElementById('cP').textContent = c['+'];
  document.getElementById('cQ').textContent = c['q'];
  document.getElementById('cM').textContent = c['-'];
  const all = total * PRAYERS.length;
  document.getElementById('bar').innerHTML =
      '<i class="s-J" style="width:'+(c['J']/all*100)+'%"></i>'
    + '<i class="s-plus" style="width:'+(c['+']/all*100)+'%"></i>'
    + '<i class="s-q" style="width:'+(c['q']/all*100)+'%"></i>'
    + '<i class="s-minus" style="width:'+(c['-']/all*100)+'%"></i>';
}

function scrollStrip(){
  const el = $strip.querySelector('.sday.sel');
  if(el) $strip.scrollLeft = el.offsetLeft - $strip.offsetLeft - ($strip.clientWidth - el.offsetWidth) / 2;
}

function refreshDay(key){
  const date = fromIso(key);
  if(date.getMonth() !== view.getMonth() || date.getFullYear() !== view.getFullYear()) return;
  const s = $strip.querySelector('.sday[data-key="'+key+'"]');
  const r = $table.querySelector('.trow[data-key="'+key+'"]');
  if(s) s.outerHTML = stripHtml(date);
  if(r) r.outerHTML = rowHtml(date);
}

function select(key){
  const prev = selected;
  selected = key;
  refreshDay(prev); refreshDay(key);
  renderFocus();
  const el = $strip.querySelector('.sday.sel');
  if(el) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

/* ---- hodisalar ---- */
document.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if(cell){
    const day = cell.dataset.day;
    const next = CYCLE[(CYCLE.indexOf(cell.dataset.state || '') + 1) % CYCLE.length];
    store.set(day, cell.dataset.prayer, next);
    refreshDay(day);
    if(day === selected) renderFocus();
    renderStats();
    renderHero();
    return;
  }
  const pick = e.target.closest('.sday, .dl');
  if(pick) select(pick.dataset.key);
});

function go(delta){
  view.setMonth(view.getMonth() + delta);
  const y = view.getFullYear(), m = view.getMonth();
  selected = (y === today.getFullYear() && m === today.getMonth()) ? todayKey : iso(new Date(y, m, 1));
  render();
}
document.getElementById('prevBtn').onclick = () => go(-1);
document.getElementById('nextBtn').onclick = () => go(1);
document.getElementById('todayBtn').onclick = () => {
  view = new Date(today.getFullYear(), today.getMonth(), 1);
  selected = todayKey; render();
};

const $clear = document.getElementById('clearBtn');
let armed = false, armTimer = null;
$clear.onclick = () => {
  if(!armed){
    armed = true; $clear.textContent = 'Aniqmi? Bosing'; $clear.classList.add('armed');
    armTimer = setTimeout(() => { armed = false; $clear.textContent = 'Oyni tozalash'; $clear.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(armTimer); armed = false; $clear.textContent = 'Oyni tozalash'; $clear.classList.remove('armed');
  store.clearMonth(view.getFullYear(), view.getMonth());
  render();
};

// bu variantda standart mavzu — qorong'i
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const light = window.matchMedia('(prefers-color-scheme: light)').matches;
  const isDark = cur ? cur === 'dark' : !light;
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
};

store.load();
render();
</script>
</body>
</html>
