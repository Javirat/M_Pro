<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namoz kalendari</title>
<style>
  :root{
    --bg:#f6f6f4;
    --surface:#ffffff;
    --surface-2:#f0efec;
    --border:#e2e0db;
    --text:#1c1b19;
    --muted:#77736c;
    --accent:#1f7a5a;
    --ok:#1f7a5a;        /* + o'qildi */
    --ok-bg:#e4f2ec;
    --jam:#0f5c8c;       /* J jamoat bilan */
    --jam-bg:#e2eef7;
    --late:#a96a10;      /* q qazo */
    --late-bg:#faefdd;
    --miss:#a63434;      /* - o'qilmadi */
    --miss-bg:#f8e5e3;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14150f;
      --surface:#1d1e18;
      --surface-2:#252620;
      --border:#33342c;
      --text:#f0efe6;
      --muted:#9b9a8f;
      --accent:#5cc79e;
      --ok:#5cc79e;   --ok-bg:#1b3630;
      --jam:#6fb6e8;  --jam-bg:#17303f;
      --late:#e0aa5a; --late-bg:#3a2e17;
      --miss:#e88b84; --miss-bg:#3b2020;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14150f; --surface:#1d1e18; --surface-2:#252620; --border:#33342c;
    --text:#f0efe6; --muted:#9b9a8f; --accent:#5cc79e;
    --ok:#5cc79e; --ok-bg:#1b3630;
    --jam:#6fb6e8; --jam-bg:#17303f;
    --late:#e0aa5a; --late-bg:#3a2e17;
    --miss:#e88b84; --miss-bg:#3b2020;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 64px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .brand span{font-size:13px;color:var(--muted)}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:10px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-size:13px;
  }
  .icon-btn:hover{background:var(--surface-2)}

  .monthbar{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:8px;margin-bottom:14px;
  }
  .monthbar .nav{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:16px;cursor:pointer;line-height:1;
  }
  .monthbar .nav:hover{border-color:var(--accent);color:var(--accent)}
  .monthbar .label{flex:1;text-align:center;font-weight:600;font-size:16px}
  .monthbar .today-btn{
    border:1px solid var(--border);background:transparent;color:var(--muted);
    border-radius:9px;height:34px;padding:0 12px;cursor:pointer;font-size:13px;
  }
  .monthbar .today-btn:hover{color:var(--accent);border-color:var(--accent)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;
  }
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat.j b{color:var(--jam)} .stat.ok b{color:var(--ok)}
  .stat.q b{color:var(--late)} .stat.m b{color:var(--miss)}

  .bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;display:flex}
  .bar i{display:block;height:100%}
  .bar .s-J{background:var(--jam)} .bar .s-plus{background:var(--ok)}
  .bar .s-q{background:var(--late)} .bar .s-minus{background:var(--miss)}

  /* ---------- legend ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 10px}
  .chip{
    width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;
    font-weight:700;font-size:12px;
  }
  .chip.J{background:var(--jam-bg);color:var(--jam)}
  .chip.plus{background:var(--ok-bg);color:var(--ok)}
  .chip.q{background:var(--late-bg);color:var(--late)}
  .chip.minus{background:var(--miss-bg);color:var(--miss)}
  .chip.none{background:var(--surface-2);color:var(--muted)}

  /* ---------- day list ---------- */
  .days{display:flex;flex-direction:column;gap:8px}
  .day{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;
  }
  .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .day.future{opacity:.55}
  .day.weekend .dow{color:var(--miss)}

  .date{display:flex;flex-direction:column;line-height:1.25}
  .date .dnum{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
  .date .dow{font-size:12px;color:var(--muted)}
  .date .badge{
    align-self:flex-start;margin-top:3px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 6px;
  }

  .prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cell{
    appearance:none;cursor:pointer;font:inherit;
    background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .06s ease, background .12s ease, border-color .12s ease;
  }
  .cell:hover{border-color:var(--accent)}
  .cell:active{transform:scale(.96)}
  .cell .pname{font-size:10px;color:var(--muted);letter-spacing:.02em}
  .cell .mark{font-size:17px;font-weight:700;line-height:1.1;min-height:21px}
  .cell[data-state=""]      .mark{color:var(--muted);opacity:.45}
  .cell[data-state="+"]{background:var(--ok-bg);border-color:transparent}
  .cell[data-state="+"] .mark{color:var(--ok)}
  .cell[data-state="+"] .pname{color:var(--ok)}
  .cell[data-state="J"]{background:var(--jam-bg);border-color:transparent}
  .cell[data-state="J"] .mark{color:var(--jam)}
  .cell[data-state="J"] .pname{color:var(--jam)}
  .cell[data-state="q"]{background:var(--late-bg);border-color:transparent}
  .cell[data-state="q"] .mark{color:var(--late)}
  .cell[data-state="q"] .pname{color:var(--late)}
  .cell[data-state="-"]{background:var(--miss-bg);border-color:transparent}
  .cell[data-state="-"] .mark{color:var(--miss)}
  .cell[data-state="-"] .pname{color:var(--miss)}

  .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

  @media (max-width:560px){
    .wrap{padding:16px 16px 48px}
    .day{grid-template-columns:1fr;gap:8px}
    .date{flex-direction:row;align-items:baseline;gap:8px}
    .date .badge{margin-top:0}
    .stats{grid-template-columns:repeat(2,1fr)}
    .cell .pname{font-size:9px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1>Namoz kalendari</h1>
      <span id="brandSub">besh vaqt namoz kundaligi</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="clearBtn">Oyni tozalash</button>
      <button class="icon-btn" id="themeBtn" title="Mavzu">◐</button>
    </div>
  </div>

  <div class="monthbar">
    <button class="nav" id="prevBtn" aria-label="Oldingi oy">‹</button>
    <div class="label" id="monthLabel">—</div>
    <button class="today-btn" id="todayBtn">Bugun</button>
    <button class="nav" id="nextBtn" aria-label="Keyingi oy">›</button>
  </div>

  <div class="stats">
    <div class="stat j"><b id="cJ">0</b><small>Jamoat (J)</small></div>
    <div class="stat ok"><b id="cP">0</b><small>O'qildi (+)</small></div>
    <div class="stat q"><b id="cQ">0</b><small>Qazo (q)</small></div>
    <div class="stat m"><b id="cM">0</b><small>O'qilmadi (−)</small></div>
  </div>

  <div class="bar" id="bar"></div>

  <div class="legend">
    <span><i class="chip J">J</i> jamoat bilan o'qildi</span>
    <span><i class="chip plus">+</i> o'qildi</span>
    <span><i class="chip q">q</i> kech / qazo o'qildi</span>
    <span><i class="chip minus">−</i> o'qilmadi</span>
    <span><i class="chip none">·</i> belgilanmagan</span>
  </div>

  <div class="days" id="days"></div>

  <p class="hint">Katakchani bosing — belgi almashadi: · → + → J → q → − → ·</p>
</div>

<script>
/* ------------------------------------------------------------------
   Faqat UI. Backend bilan bog'liq emas.
   Ma'lumot brauzer xotirasida (localStorage) saqlanadi — keyinchalik
   store.load / store.save o'rniga API chaqiruvlarini qo'yish kifoya.
------------------------------------------------------------------- */

const PRAYERS = [
  { key:'bomdod', name:'Bomdod' },
  { key:'peshin', name:'Peshin' },
  { key:'asr',    name:'Asr'    },
  { key:'shom',   name:'Shom'   },
  { key:'xufton', name:'Xufton' },
];

const CYCLE  = ['', '+', 'J', 'q', '-'];
const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const DOW    = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

/* ---- store (mock) ---- */
const store = {
  KEY: 'namoz:v1',
  data: {},
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch(e){ this.data = {}; }
  },
  save(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  },
  get(day, prayer){ return (this.data[day] || {})[prayer] || ''; },
  set(day, prayer, val){
    if(!this.data[day]) this.data[day] = {};
    if(val) this.data[day][prayer] = val; else delete this.data[day][prayer];
    if(!Object.keys(this.data[day]).length) delete this.data[day];
    this.save();
  },
  clearMonth(y, m){
    const pre = y + '-' + String(m+1).padStart(2,'0') + '-';
    Object.keys(this.data).forEach(k => { if(k.startsWith(pre)) delete this.data[k]; });
    this.save();
  }
};

/* ---- holat ---- */
const today = new Date();
const todayKey = iso(today);
let view = new Date(today.getFullYear(), today.getMonth(), 1);

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function pretty(d){
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}

/* ---- render ---- */
const $days = document.getElementById('days');
const $label = document.getElementById('monthLabel');

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  $label.textContent = MONTHS[m] + ' ' + y;

  const total = new Date(y, m+1, 0).getDate();
  let html = '';

  for(let d = 1; d <= total; d++){
    const date = new Date(y, m, d);
    const key  = iso(date);
    const dow  = date.getDay();
    const cls  = [
      'day',
      key === todayKey ? 'today' : '',
      date > today ? 'future' : '',
      (dow === 0 || dow === 6) ? 'weekend' : ''
    ].join(' ').trim();

    let cells = '';
    for(const p of PRAYERS){
      const st = store.get(key, p.key);
      cells += '<button class="cell" data-day="'+key+'" data-prayer="'+p.key+'" data-state="'+st+'" title="'+p.name+'">'
             +   '<span class="pname">'+p.name+'</span>'
             +   '<span class="mark">'+(st === '-' ? '−' : (st || '·'))+'</span>'
             + '</button>';
    }

    html += '<article class="'+cls+'">'
          +   '<div class="date">'
          +     '<span class="dnum">'+pretty(date)+'</span>'
          +     '<span class="dow">'+DOW[dow]+'</span>'
          +     (key === todayKey ? '<span class="badge">bugun</span>' : '')
          +   '</div>'
          +   '<div class="prayers">'+cells+'</div>'
          + '</article>';
  }

  $days.innerHTML = html;
  renderStats(y, m, total);

  const t = $days.querySelector('.day.today');
  if(t && !render.scrolled){ t.scrollIntoView({block:'center'}); render.scrolled = true; }
}

function renderStats(y, m, total){
  const c = { 'J':0, '+':0, 'q':0, '-':0 };
  for(let d = 1; d <= total; d++){
    const rec = store.data[iso(new Date(y, m, d))] || {};
    for(const p of PRAYERS){ const s = rec[p.key]; if(s in c) c[s]++; }
  }
  document.getElementById('cJ').textContent = c['J'];
  document.getElementById('cP').textContent = c['+'];
  document.getElementById('cQ').textContent = c['q'];
  document.getElementById('cM').textContent = c['-'];

  const all = total * PRAYERS.length;
  const bar = document.getElementById('bar');
  bar.innerHTML =
      '<i class="s-J" style="width:'+(c['J']/all*100)+'%"></i>'
    + '<i class="s-plus" style="width:'+(c['+']/all*100)+'%"></i>'
    + '<i class="s-q" style="width:'+(c['q']/all*100)+'%"></i>'
    + '<i class="s-minus" style="width:'+(c['-']/all*100)+'%"></i>';
}

/* ---- hodisalar ---- */
$days.addEventListener('click', e => {
  const btn = e.target.closest('.cell');
  if(!btn) return;
  const cur  = btn.dataset.state || '';
  const next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
  btn.dataset.state = next;
  btn.querySelector('.mark').textContent = next === '-' ? '−' : (next || '·');
  store.set(btn.dataset.day, btn.dataset.prayer, next);
  renderStats(view.getFullYear(), view.getMonth(), new Date(view.getFullYear(), view.getMonth()+1, 0).getDate());
});

document.getElementById('prevBtn').onclick = () => { view.setMonth(view.getMonth()-1); render(); };
document.getElementById('nextBtn').onclick = () => { view.setMonth(view.getMonth()+1); render(); };
document.getElementById('todayBtn').onclick = () => {
  view = new Date(today.getFullYear(), today.getMonth(), 1);
  render.scrolled = false; render();
};

const $clear = document.getElementById('clearBtn');
let armed = false, armTimer = null;
$clear.onclick = () => {
  if(!armed){
    armed = true; $clear.textContent = 'Aniqmi? Bosing';
    armTimer = setTimeout(() => { armed = false; $clear.textContent = 'Oyni tozalash'; }, 3000);
    return;
  }
  clearTimeout(armTimer); armed = false; $clear.textContent = 'Oyni tozalash';
  store.clearMonth(view.getFullYear(), view.getMonth());
  render();
};

document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
};

store.load();
render();
</script>
</body>
</html>
