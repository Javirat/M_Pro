<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0">
<title>Namoz kalendari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Variant 5 — "Ramadhan Habit Tracker": och kulrang, oq kartalar, yalpiz→sariq gradient, ko'k belgilar */
  :root{
    --bg:#f2f2f0;
    --frame-1:#c9f0cf;
    --frame-2:#f6e7a6;
    --surface:#ffffff;
    --surface-2:#f4f4f2;
    --border:#e9e9e6;
    --text:#161616;
    --muted:#7d7d78;
    --dark:#1c1c1c;
    --dark-text:#ffffff;
    --blue:#2340e6;
    --green-cta:#4ff05a;
    --flame:#f0592a;
    --grad:linear-gradient(110deg,#d2f7d8 0%,#f3eaa9 100%);
    --ok:#2340e6;   --ok-bg:#d3fbde;
    --jam:#11a44a;  --jam-bg:#c6f4d2;
    --late:#c98407; --late-bg:#fdf1cf;
    --miss:#e0463e; --miss-bg:#fde4e1;
    --shadow:0 2px 10px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f100f; --frame-1:#12301b; --frame-2:#332d10;
      --surface:#1b1c1b; --surface-2:#242523; --border:#2d2e2c;
      --text:#f3f3ef; --muted:#9a9a93; --dark:#f3f3ef; --dark-text:#111;
      --blue:#7d93ff; --green-cta:#4ff05a; --flame:#ff7a4d;
      --grad:linear-gradient(110deg,#17392a 0%,#3a3413 100%);
      --ok:#7d93ff;   --ok-bg:#16352a;
      --jam:#4ee07e;  --jam-bg:#123a22;
      --late:#f2bb4a; --late-bg:#3a2f12;
      --miss:#ff8a80; --miss-bg:#3d1d1b;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f100f; --frame-1:#12301b; --frame-2:#332d10;
    --surface:#1b1c1b; --surface-2:#242523; --border:#2d2e2c;
    --text:#f3f3ef; --muted:#9a9a93; --dark:#f3f3ef; --dark-text:#111;
    --blue:#7d93ff; --green-cta:#4ff05a; --flame:#ff7a4d;
    --grad:linear-gradient(110deg,#17392a 0%,#3a3413 100%);
    --ok:#7d93ff;   --ok-bg:#16352a;
    --jam:#4ee07e;  --jam-bg:#123a22;
    --late:#f2bb4a; --late-bg:#3a2f12;
    --miss:#ff8a80; --miss-bg:#3d1d1b;
    --shadow:none;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  button{font:inherit;color:inherit}
  svg{display:block}

  .wrap{max-width:1120px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
  .cols{display:grid;grid-template-columns:1fr;gap:18px}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* ---------- yuqori panel ---------- */
  .appbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .appbar h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-align:center;flex:1}
  .circle-btn{
    width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;flex:none;
    background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;
  }
  .circle-btn:hover{background:var(--surface-2)}

  .clock{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .clock b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .clock small{font-size:13px;color:var(--muted)}

  /* ---------- eslatma ---------- */
  .notice{
    background:var(--dark);color:var(--dark-text);border-radius:18px;padding:16px;
    display:flex;align-items:center;gap:14px;position:relative;
  }
  .notice .av{width:44px;height:44px;border-radius:50%;background:rgba(127,127,127,.28);display:grid;place-items:center;flex:none}
  .notice b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
  .notice p{margin:0;font-size:12px;opacity:.8;padding-right:18px}
  .notice .info{position:absolute;top:12px;right:12px;opacity:.8}

  /* ---------- oy + kunlar lentasi ---------- */
  .sec{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sec h2{margin:0;font-size:16px;font-weight:600}
  .sec .more{
    border:none;background:none;cursor:pointer;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:4px;padding:6px 0;
  }
  .sec .more:hover{color:var(--text)}
  .mnav{display:flex;align-items:center;gap:6px}
  .mnav button{
    width:32px;height:32px;border-radius:50%;border:none;background:var(--surface);box-shadow:var(--shadow);
    cursor:pointer;display:grid;place-items:center;
  }
  .mnav span{font-size:14px;font-weight:600;min-width:118px;text-align:center}

  .strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .sday{
    flex:none;width:62px;height:88px;scroll-snap-align:center;cursor:pointer;border:none;
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .sday .w{font-size:14px;color:var(--text)}
  .sday .r{position:relative;width:36px;height:36px;display:grid;place-items:center}
  .sday .r svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .sday .r b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .sday.sel{background:var(--grad)}
  .sday.future{opacity:.55}
  .sday.today .w{font-weight:700}

  /* ---------- namozlar ro'yxati ---------- */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:14px;padding:12px 14px;transition:background .15s ease;
  }
  .row .al{width:40px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);flex:none}
  .row .al small{font-size:11px;color:var(--text);white-space:nowrap}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-size:16px;font-weight:500}
  .row .tx span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--flame);margin-top:2px}
  .row .st{font-size:12px;color:var(--muted);margin-right:2px;white-space:nowrap}
  .row[data-state="+"]{background:var(--ok-bg)}
  .row[data-state="J"]{background:var(--jam-bg)}
  .row[data-state="q"]{background:var(--late-bg)}
  .row[data-state="-"]{background:var(--miss-bg)}

  .cell{
    appearance:none;cursor:pointer;flex:none;width:30px;height:30px;border-radius:50%;padding:0;
    border:1.5px solid #9c9c98;background:transparent;display:grid;place-items:center;
    font-size:13px;font-weight:700;color:transparent;transition:transform .08s ease;
  }
  .cell:active{transform:scale(.88)}
  .cell[data-state="+"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .cell[data-state="J"]{background:var(--jam);border-color:var(--jam);color:#fff}
  .cell[data-state="q"]{background:var(--late);border-color:var(--late);color:#fff}
  .cell[data-state="-"]{background:var(--miss);border-color:var(--miss);color:#fff}

  /* ---------- bajarildi kartasi ---------- */
  .done-card{
    background:var(--grad);border-radius:18px;padding:16px;display:flex;align-items:center;gap:16px;
    box-shadow:var(--shadow);
  }
  .ring{position:relative;width:62px;height:62px;flex:none;display:grid;place-items:center;
    background:var(--surface);border-radius:50%}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ring b{font-size:13px;font-weight:700;line-height:1;text-align:center}
  .ring b small{display:block;font-size:9px;font-weight:500;color:var(--muted);margin-top:2px}
  .done-card .tx{flex:1}
  .done-card .tx b{display:block;font-size:19px;font-weight:600}
  .done-card .tx span{font-size:15px;color:var(--muted)}
  :root:not([data-theme="dark"]) .done-card .tx span{color:#4b4b46}
  .go{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}

  /* ---------- statistik tugmalar ---------- */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  }
  .tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px}
  .tile b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .tile small{font-size:11px;font-weight:600}
  .tile.j .ic{background:var(--jam-bg);color:var(--jam)}
  .tile.ok .ic{background:var(--ok-bg);color:var(--ok)}
  .tile.q .ic{background:var(--late-bg);color:var(--late)}
  .tile.m .ic{background:var(--miss-bg);color:var(--miss)}
  .tile.hl{background:var(--grad)}

  .bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .s-J{background:var(--jam)} .bar .s-plus{background:var(--ok)}
  .bar .s-q{background:var(--late)} .bar .s-minus{background:var(--miss)}

  .legend{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 14px}
  .legend div{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-top:1px solid var(--border)}
  .legend div:first-child{border-top:none}
  .legend .cell{width:24px;height:24px;font-size:11px;cursor:default}

  .cta{
    width:100%;height:54px;border:none;border-radius:99px;cursor:pointer;
    background:var(--green-cta);color:#0c1a0c;font-size:16px;font-weight:600;
    transition:filter .15s ease, background .15s ease;
  }
  .cta:hover{filter:brightness(.96)}
  .cta.armed{background:var(--miss);color:#fff}

  .hint{margin:0;font-size:12px;color:var(--muted);text-align:center}

  /* ---------- pastki menyu ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:var(--surface);border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-around;
  }
  .tabbar button{
    border:none;background:none;cursor:pointer;width:52px;height:44px;border-radius:12px;
    display:grid;place-items:center;color:var(--text);opacity:.75;
  }
  .tabbar button.on{opacity:1}
  .tabbar button:hover{background:var(--surface-2);opacity:1}

  /* ---------- keng ekran ---------- */
  @media (min-width:900px){
    body{
      padding-bottom:0;
      background:linear-gradient(110deg,var(--frame-1),var(--frame-2)) fixed;
    }
    .wrap{padding-top:28px;padding-bottom:40px}
    .cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
    .col{background:var(--bg);border-radius:32px;padding:22px}
    .tabbar{position:sticky;bottom:auto;border:none;background:transparent;padding:0;margin:0 0 18px;justify-content:center;gap:8px}
    .tabbar button{background:var(--surface);opacity:1;border-radius:14px}
  }
  @media (max-width:380px){
    .tiles{gap:6px}
    .tile small{font-size:10px}
    .sday{width:56px}
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="tabbar" id="tabbar">
    <button class="on" data-go="top" aria-label="Bosh sahifa">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button data-go="today" aria-label="Bugun">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg>
    </button>
    <button data-go="stats" aria-label="Statistika">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 12V3.5M12 12l6 6"/></svg>
    </button>
    <button data-go="theme" aria-label="Mavzu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </nav>

  <div class="cols">
    <!-- ===== 1-ustun: kun tartibi ===== -->
    <section class="col" id="top">
      <div class="appbar">
        <button class="circle-btn" id="themeBtn" aria-label="Mavzu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>
        </button>
        <h1>Namoz kalendari</h1>
        <button class="circle-btn" id="todayBtn" aria-label="Bugun">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        </button>
      </div>

      <div class="notice">
        <div class="av">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 20a2 2 0 0 1-3.4 0"/></svg>
        </div>
        <div>
          <b>Eslatma!</b>
          <p id="noticeTxt">—</p>
        </div>
        <svg class="info" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </div>

      <div class="sec">
        <div class="mnav">
          <button id="prevBtn" aria-label="Oldingi oy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
          <span id="monthLabel">—</span>
          <button id="nextBtn" aria-label="Keyingi oy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="strip" id="strip"></div>

      <div class="sec">
        <h2 id="listTitle">Kun tartibi</h2>
        <span class="row-note" style="font-size:13px;color:var(--muted)" id="listSub">0/5</span>
      </div>
      <div class="list" id="list"></div>
      <p class="hint">Doirachani bosing: · → + → J → q → − → ·</p>
    </section>

    <!-- ===== 2-ustun: natijalar ===== -->
    <section class="col" id="stats">
      <div class="clock">
        <div>
          <b id="clock">--:--</b>
          <small id="clockSub">—</small>
        </div>
      </div>

      <div class="done-card">
        <div class="ring">
          <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="27" fill="none" stroke="var(--border)" stroke-width="4"/><circle id="ringArc" cx="31" cy="31" r="27" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 170"/></svg>
          <b id="ringTxt">0%<small>oy</small></b>
        </div>
        <div class="tx"><b>Bajarildi</b><span id="doneSub">Oylik natija</span></div>
        <span class="go"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </div>

      <div class="tiles">
        <div class="tile j hl"><span class="ic">J</span><b id="cJ">0</b><small>Jamoat</small></div>
        <div class="tile ok"><span class="ic">+</span><b id="cP">0</b><small>O'qildi</small></div>
        <div class="tile q"><span class="ic">q</span><b id="cQ">0</b><small>Qazo</small></div>
        <div class="tile m"><span class="ic">−</span><b id="cM">0</b><small>O'qilmadi</small></div>
      </div>

      <div class="bar" id="bar"></div>

      <div class="sec"><h2>Belgilar</h2></div>
      <div class="legend">
        <div><span class="cell" data-state="J">J</span> jamoat bilan o'qildi</div>
        <div><span class="cell" data-state="+">✓</span> o'qildi</div>
        <div><span class="cell" data-state="q">q</span> kech / qazo o'qildi</div>
        <div><span class="cell" data-state="-">−</span> o'qilmadi</div>
        <div><span class="cell" data-state=""></span> belgilanmagan</div>
      </div>

      <button class="cta" id="clearBtn">Oyni tozalash</button>
    </section>
  </div>
</div>

<script>
/* Faqat UI — ma'lumot localStorage'da (index.html bilan bir xil kalit). */

const ICONS = {
  bomdod:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.6 10.6l1.4 1.4M18.4 10.6 17 12"/></svg>',
  peshin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  asr:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 3v6M9 6l3 3 3-3"/></svg>',
  shom:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 9V3M9 6l3-3 3 3"/></svg>',
  xufton:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>',
};
const FLAME = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 10.5 11C10.5 7 12 2 12 2Z"/></svg>';

const PRAYERS = [
  { key:'bomdod', name:'Bomdod', time:'Tong' },
  { key:'peshin', name:'Peshin', time:'Tush' },
  { key:'asr',    name:'Asr',    time:'Ikkindi' },
  { key:'shom',   name:'Shom',   time:'Oqshom' },
  { key:'xufton', name:'Xufton', time:'Kecha' },
];
const CYCLE  = ['', '+', 'J', 'q', '-'];
const LABEL  = { '':'', '+':"o'qildi", 'J':'jamoat', 'q':'qazo', '-':"o'qilmadi" };
const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const DOW    = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const DOW_S  = ['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];

const store = {
  KEY: 'namoz:v1',
  data: {},
  load(){
    try { this.data = JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch(e){ this.data = {}; }
  },
  save(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  },
  get(day, prayer){ return (this.data[day] || {})[prayer] || ''; },
  set(day, prayer, val){
    if(!this.data[day]) this.data[day] = {};
    if(val) this.data[day][prayer] = val; else delete this.data[day][prayer];
    if(!Object.keys(this.data[day]).length) delete this.data[day];
    this.save();
  },
  clearMonth(y, m){
    const pre = y + '-' + String(m+1).padStart(2,'0') + '-';
    Object.keys(this.data).forEach(k => { if(k.startsWith(pre)) delete this.data[k]; });
    this.save();
  }
};

const today = new Date();
const todayKey = iso(today);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = todayKey;

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromIso(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function pretty(d){
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
const markOf  = st => st === '+' ? '✓' : st === '-' ? '−' : st;
const done    = st => st === '+' || st === 'J' || st === 'q';
const dayDone = key => PRAYERS.filter(p => done(store.get(key, p.key))).length;
const daysIn  = () => new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();

/* halqa uchun svg: p = 0..1 */
function ringSvg(p){
  const c = 2*Math.PI*16;
  return '<svg width="36" height="36" viewBox="0 0 36 36">'
       +   '<circle cx="18" cy="18" r="16" fill="none" stroke="var(--border)" stroke-width="2"/>'
       +   (p > 0 ? '<circle cx="18" cy="18" r="16" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'"/>' : '')
       + '</svg>';
}

/* ---- render ---- */
const $strip = document.getElementById('strip');
const $list  = document.getElementById('list');

function render(){
  document.getElementById('monthLabel').textContent = MONTHS[view.getMonth()] + ' ' + view.getFullYear();
  renderStrip();
  renderList();
  renderStats();
  renderNotice();
}

function stripHtml(date){
  const key = iso(date);
  const cls = ['sday', key === todayKey ? 'today' : '', key === selected ? 'sel' : '', date > today ? 'future' : '']
                .join(' ').replace(/\s+/g,' ').trim();
  return '<button class="'+cls+'" data-key="'+key+'">'
       +   '<span class="w">'+DOW_S[date.getDay()]+'</span>'
       +   '<span class="r">'+ringSvg(dayDone(key)/5)+'<b>'+String(date.getDate()).padStart(2,'0')+'</b></span>'
       + '</button>';
}

function renderStrip(){
  const y = view.getFullYear(), m = view.getMonth();
  let html = '';
  for(let d = 1; d <= daysIn(); d++) html += stripHtml(new Date(y, m, d));
  $strip.innerHTML = html;
  const el = $strip.querySelector('.sday.sel');
  if(el) $strip.scrollLeft = el.offsetLeft - $strip.offsetLeft - ($strip.clientWidth - el.offsetWidth) / 2;
}

function refreshStripDay(key){
  const el = $strip.querySelector('.sday[data-key="'+key+'"]');
  if(el) el.outerHTML = stripHtml(fromIso(key));
}

/* shu oyda ushbu namoz necha marta o'qilgan */
function monthDone(prayer){
  const y = view.getFullYear(), m = view.getMonth();
  let n = 0;
  for(let d = 1; d <= daysIn(); d++) if(done(store.get(iso(new Date(y, m, d)), prayer))) n++;
  return n;
}

function renderList(){
  const date = fromIso(selected);
  document.getElementById('listTitle').textContent =
    selected === todayKey ? 'Bugungi namozlar' : DOW[date.getDay()] + ', ' + pretty(date);
  document.getElementById('listSub').textContent = dayDone(selected) + '/5 bajarildi';

  $list.innerHTML = PRAYERS.map(p => {
    const st = store.get(selected, p.key);
    return '<div class="row" data-state="'+st+'">'
         +   '<span class="al">'+ICONS[p.key]+'<small>'+p.time+'</small></span>'
         +   '<span class="tx"><b>'+p.name+' namozi</b><span>'+FLAME+' Oyda '+monthDone(p.key)+'/'+daysIn()+' kun</span></span>'
         +   (st ? '<span class="st">'+LABEL[st]+'</span>' : '')
         +   '<button class="cell" data-day="'+selected+'" data-prayer="'+p.key+'" data-state="'+st+'" aria-label="'+p.name+'">'+markOf(st)+'</button>'
         + '</div>';
  }).join('');
}

function renderStats(){
  const y = view.getFullYear(), m = view.getMonth();
  const total = daysIn();
  const c = { 'J':0, '+':0, 'q':0, '-':0 };
  for(let d = 1; d <= total; d++){
    const rec = store.data[iso(new Date(y, m, d))] || {};
    for(const p of PRAYERS){ const s = rec[p.key]; if(s in c) c[s]++; }
  }
  document.getElementById('cJ').textContent = c['J'];
  document.getElementById('cP').textContent = c['+'];
  document.getElementById('cQ').textContent = c['q'];
  document.getElementById('cM').textContent = c['-'];

  const all = total * PRAYERS.length;
  document.getElementById('bar').innerHTML =
      '<i class="s-J" style="width:'+(c['J']/all*100)+'%"></i>'
    + '<i class="s-plus" style="width:'+(c['+']/all*100)+'%"></i>'
    + '<i class="s-q" style="width:'+(c['q']/all*100)+'%"></i>'
    + '<i class="s-minus" style="width:'+(c['-']/all*100)+'%"></i>';

  const doneN = c['J'] + c['+'] + c['q'];
  const pct = Math.round(doneN / all * 100);
  const circ = 2*Math.PI*27;
  document.getElementById('ringArc').setAttribute('stroke-dasharray', (circ*doneN/all)+' '+circ);
  document.getElementById('ringTxt').innerHTML = pct + '%<small>'+MONTHS[m].slice(0,3).toLowerCase()+'</small>';
  document.getElementById('doneSub').textContent = doneN + ' / ' + all + ' namoz';
}

function renderNotice(){
  const n = dayDone(todayKey);
  const empty = PRAYERS.filter(p => !store.get(todayKey, p.key)).map(p => p.name);
  let txt;
  if(n === 5) txt = "Barakalloh! Bugungi besh vaqt namoz ham o'qildi.";
  else if(empty.length) txt = 'Bugun belgilanmagan: ' + empty.join(', ') + '. Ro‘yxatdan belgilab qo‘ying.';
  else txt = "Bugun " + (5-n) + " ta namoz o'qilmagan deb belgilangan. Qazosini o'qib, q qo'yishingiz mumkin.";
  document.getElementById('noticeTxt').textContent = txt;
}

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clockSub').textContent = DOW[now.getDay()] + ', ' + pretty(now);
}

/* ---- hodisalar ---- */
$strip.addEventListener('click', e => {
  const b = e.target.closest('.sday');
  if(!b) return;
  const prev = selected;
  selected = b.dataset.key;
  refreshStripDay(prev); refreshStripDay(selected);
  renderList();
});

$list.addEventListener('click', e => {
  const b = e.target.closest('.cell');
  if(!b) return;
  const next = CYCLE[(CYCLE.indexOf(b.dataset.state || '') + 1) % CYCLE.length];
  store.set(b.dataset.day, b.dataset.prayer, next);
  renderList();
  refreshStripDay(b.dataset.day);
  renderStats();
  renderNotice();
});

function go(delta){
  view.setMonth(view.getMonth() + delta);
  const y = view.getFullYear(), m = view.getMonth();
  selected = (y === today.getFullYear() && m === today.getMonth()) ? todayKey : iso(new Date(y, m, 1));
  render();
}
function goToday(){
  view = new Date(today.getFullYear(), today.getMonth(), 1);
  selected = todayKey; render();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
}

document.getElementById('prevBtn').onclick = () => go(-1);
document.getElementById('nextBtn').onclick = () => go(1);
document.getElementById('todayBtn').onclick = goToday;
document.getElementById('themeBtn').onclick = toggleTheme;

document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  const act = b.dataset.go;
  if(act === 'theme') return toggleTheme();
  if(act === 'today') goToday();
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
  const target = act === 'stats' ? document.getElementById('stats') : document.getElementById('top');
  target.scrollIntoView({behavior:'smooth', block:'start'});
});

const $clear = document.getElementById('clearBtn');
let armed = false, armTimer = null;
$clear.onclick = () => {
  if(!armed){
    armed = true; $clear.textContent = 'Aniqmi? Yana bosing'; $clear.classList.add('armed');
    armTimer = setTimeout(() => { armed = false; $clear.textContent = 'Oyni tozalash'; $clear.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(armTimer); armed = false; $clear.textContent = 'Oyni tozalash'; $clear.classList.remove('armed');
  store.clearMonth(view.getFullYear(), view.getMonth());
  render();
};

store.load();
tick(); setInterval(tick, 30000);
render();
</script>
</body>
</html>
